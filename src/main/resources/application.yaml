spring:
  application:
    name: orvendiq-backend

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ORVENDIQ_APP
    password: ${ORVENDIQ_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true
